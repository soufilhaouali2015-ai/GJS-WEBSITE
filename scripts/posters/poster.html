<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Affiche GJS</title>
<!--
  GJS · GABARIT D'AFFICHE (640 x 800)
  Rempli par build-posters.mjs : les marques FONTS (polices en base64), BG (fond)
  et CONTENT (composition propre à chaque service, voir compositions.mjs),
  écrites entre doubles accolades plus bas.
  Palette stricte : crème, noir doux, citron + crème foncé et gris chaud.
-->
<style>
{{FONTS}}

:root {
  --cream: #F4F0E8;
  --cream-2: #E8E1D2;
  --ink: #141414;
  --lime: #D4FF3A;
  --grey: #57524A;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 640px;
  height: 800px;
  overflow: hidden;
}

body {
  position: relative;
  background: var(--bg);
  font-family: "Poppins", sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}

.abs, .layer, .paper, .tape, .sticker, .icon, .mark, .tagline { position: absolute; }

.layer { overflow: visible; pointer-events: none; }

/* Papier déchiré */
.paper { transform-origin: 50% 50%; }
.paper__layer { position: absolute; inset: 0; }
.paper__inner {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* Ruban adhésif */
.tape { opacity: 0.94; }

/* Grands mots */
.word {
  display: block;
  width: max-content;
  font-family: "Bebas Neue", sans-serif;
  font-weight: 400;
  line-height: 0.84;
  letter-spacing: 0.005em;
  text-transform: uppercase;
  white-space: nowrap;
}
.word--v {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  height: max-content;
  width: auto;
}
.word--outline {
  -webkit-text-stroke: 0.035em var(--ink);
  paint-order: stroke fill;
}

/* Stickers */
.sticker {
  display: flex;
  flex-direction: column;
  padding: 0.24em 0.34em 0.1em;
  border: 3px solid var(--ink);
  border-radius: 4px;
  font-family: "Bebas Neue", sans-serif;
  line-height: 0.95;
  letter-spacing: 0.02em;
  white-space: nowrap;
  transform-origin: 50% 50%;
}
.sticker__line { display: block; }
.sticker__sub {
  display: inline-block;
  vertical-align: top;
  margin: 0.2em 0 0 0.32em;
  font-size: 0.36em;
  letter-spacing: 0.06em;
  line-height: 1;
}
.sticker--round {
  align-items: center;
  justify-content: center;
  padding: 0;
  border-radius: 50%;
  text-align: center;
  line-height: 0.92;
}
.nnbsp { display: inline-block; width: 0.16em; }

/* Pictogramme */
.icon svg { display: block; width: 100%; height: 100%; overflow: visible; }
.tile {
  position: absolute;
  display: grid;
  place-items: center;
  border: 3px solid var(--ink);
}
.tile > .icon { position: static; }

/* Signature */
.mark {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: "Bebas Neue", sans-serif;
  line-height: 1;
}
.mark__logo {
  padding: 5px 8px 2px;
  border: 3px solid var(--ink);
  border-radius: 4px;
  font-size: 30px;
  letter-spacing: 0.04em;
}
.mark__num { font-size: 28px; letter-spacing: 0.06em; }

/* Accroche */
.tagline {
  line-height: 1.22;
  letter-spacing: -0.005em;
  text-wrap: balance;
}
</style>
</head>
<body style="--bg: var(--{{BG}})">
{{CONTENT}}
<script>
  /* Ajuste chaque grand mot à sa largeur (ou hauteur) cible, sans dépasser data-max. */
  (async () => {
    await document.fonts.ready;
    await Promise.all([
      document.fonts.load('100px "Bebas Neue"'),
      document.fonts.load('400 20px "Poppins"'),
      document.fonts.load('500 20px "Poppins"'),
      document.fonts.load('600 20px "Poppins"'),
    ]);
    for (const el of document.querySelectorAll('[data-fit]')) {
      el.style.fontSize = '100px';
      const size = el.dataset.axis === 'h' ? el.offsetHeight : el.offsetWidth;
      const target = parseFloat(el.dataset.fit);
      const max = parseFloat(el.dataset.max || '9999');
      el.style.fontSize = `${Math.min(max, (100 * target) / size)}px`;
    }
    window.__posterReady = true;
  })();
</script>
</body>
</html>
